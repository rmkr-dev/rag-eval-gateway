spring:
  application:
    name: rag-eval-gateway
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

# Providers and model aliases. Keys come from the environment or Key Vault, never from this file.
gateway:
  providers: {}
  models: {}
  retry:
    max-attempts: 2
    initial-backoff: 200ms
    max-backoff: 2s
