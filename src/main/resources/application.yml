spring:
  application:
    name: rag-eval-gateway
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # In-memory H2 for local runs. Point SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD at
  # Postgres anywhere the data matters; Flyway creates the schema on startup.
  datasource:
    url: jdbc:h2:mem:gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

# Providers and model aliases. Keys come from the environment or Key Vault, never from this file.
gateway:
  providers: {}
  models: {}
  retry:
    max-attempts: 2
    initial-backoff: 200ms
    max-backoff: 2s
  # Prices per million tokens. Calls without a matching price are stored without a cost.
  pricing:
    currency: USD
    prices: []
  tracking:
    enabled: true
    queue-capacity: 10000
    batch-size: 200
    flush-interval: 1s
    retention: 90d
  # Reports API and dashboard, for callers with ROLE_GATEWAY_REPORTS. The dashboard shows UTC
  # unless ?zone= says otherwise.
  reports:
    enabled: true
    default-range: 24h
    max-range: 31d
    max-rows: 500000
    dashboard:
      enabled: true
  # Caller identity for tracking comes from the validated token: the calling application id
  # (azp or appid) unless client-claim names another claim. client-names gives ids readable
  # names in reports, for example "11111111-...": billing-api.
  auth:
    client-claim: ""
    client-names: {}

# Entra ID auth (rmkr-dev/spring-security-jwt-starter). Every endpoint except health and info
# needs a valid token. Set ENTRA_SECURITY_TENANTID and ENTRA_SECURITY_CLIENTID; startup fails
# without them. For local runs without Entra use the local profile, which turns auth off.
entra:
  security:
    enabled: true
    app-role-mappings:
      "[Gateway.Call]": [GATEWAY_CALLER]
      "[Gateway.Reports]": [GATEWAY_REPORTS]
