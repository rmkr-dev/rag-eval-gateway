spring:
  application:
    name: rag-eval-gateway
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # In-memory H2 for local runs. Point SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD at
  # Postgres anywhere the data matters; Flyway creates the schema on startup.
  datasource:
    url: jdbc:h2:mem:gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

# Providers and model aliases. Keys come from the environment or Key Vault, never from this file.
gateway:
  providers: {}
  models: {}
  retry:
    max-attempts: 2
    initial-backoff: 200ms
    max-backoff: 2s
  # Prices per million tokens. Calls without a matching price are stored without a cost.
  pricing:
    currency: USD
    prices: []
  tracking:
    enabled: true
    queue-capacity: 10000
    batch-size: 200
    flush-interval: 1s
    retention: 90d
  # Reports API and dashboard. No authentication until Entra arrives (milestone 6), so keep
  # them off the public internet or turn them off.
  reports:
    enabled: true
    default-range: 24h
    max-range: 31d
    max-rows: 500000
    dashboard:
      enabled: true
