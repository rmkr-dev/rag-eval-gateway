# Key Vault secrets mounted as files by the Secrets Store CSI driver, read through workload
# identity. Each objectAlias is a property or placeholder name: Spring reads the directory as
# a config tree, so nothing is copied into a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rag-eval-gateway-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_ME
    keyvaultName: REPLACE_ME
    tenantId: REPLACE_ME
    objects: |
      array:
        - |
          objectName: gateway-db-password
          objectType: secret
          objectAlias: spring.datasource.password
        - |
          objectName: openrouter-api-key
          objectType: secret
          objectAlias: OPENROUTER_API_KEY
        - |
          objectName: anthropic-api-key
          objectType: secret
          objectAlias: ANTHROPIC_API_KEY
