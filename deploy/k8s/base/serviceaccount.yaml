# Azure workload identity: the pods exchange this account's token for an Entra token of the
# user-assigned managed identity below. It needs a federated credential for
# system:serviceaccount:<namespace>:rag-eval-gateway and "Key Vault Secrets User" on the vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-eval-gateway
  annotations:
    azure.workload.identity/client-id: REPLACE_ME
  labels:
    azure.workload.identity/use: "true"
