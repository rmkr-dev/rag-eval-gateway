apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-eval-gateway-dev

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: rag-eval-gateway-dev
    includeSelectors: false

configMapGenerator:
  - name: rag-eval-gateway-env
    behavior: merge
    envs:
      - gateway.env

images:
  - name: rag-eval-gateway
    newName: REPLACE_ME.azurecr.io/rag-eval-gateway
    newTag: "main"

replicas:
  - name: rag-eval-gateway
    count: 1

patches:
  - path: identity.yaml
  - path: ingress.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: rag-eval-gateway
  - target:
      kind: HorizontalPodAutoscaler
      name: rag-eval-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Deployment
      name: rag-eval-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 768Mi
