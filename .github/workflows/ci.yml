name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: mvn verify (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag rag-eval-gateway:ci .

      - name: Smoke test
        run: |
          docker run -d --name gateway -p 8080:8080 rag-eval-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then
              echo; docker rm -f gateway >/dev/null; exit 0
            fi
            sleep 2
          done
          docker logs gateway
          exit 1
