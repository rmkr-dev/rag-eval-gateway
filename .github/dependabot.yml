version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
    ignore:
      # Boot 5 would be a separate major. 4.x minors and patches are welcome.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    ignore:
      # The gateway targets Java 21 LTS. Only patch-level image refreshes are wanted here;
      # moving to a newer JDK is a deliberate change, not a Dependabot bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
